<!doctype html>
<html lang="en" data-design="print">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a132b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Our living Bangkok and Chiang Mai map — independent fashion, niche fragrances, art and places to explore.">
  <title>Thailand / Living Map</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    (function(){
      const preview=new URLSearchParams(location.search).get('design');
      document.documentElement.dataset.design=['soft','type'].includes(preview)?preview:'print';
    })();
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css?v=4">
  <link rel="stylesheet" href="./trip.css?v=1">
  <link rel="stylesheet" href="./design-system.css?v=1">
  <link rel="stylesheet" href="./print-club.css?v=5">
  <link rel="stylesheet" href="./place-cards.css?v=1">
  <link rel="stylesheet" href="./discover-overlay.css?v=10">
  <link rel="stylesheet" href="./cmy-ink.css?v=2">
  <link rel="stylesheet" href="./glyph-cluster.css?v=1">
  <link rel="stylesheet" href="./photo-editorial.css?v=3">
</head>
<body>
  <div id="app">
    <header class="masthead">
      <div class="brand">
        <div class="eyebrow">FIELD GUIDE / 2027</div>
        <h1>THAILAND<i>/</i><em>MAP</em></h1>
      </div>
      <nav class="mode-picker" id="mode-picker" aria-label="Map mode"><button type="button" class="active" data-mode="explore" aria-pressed="true">Explore</button><button type="button" data-mode="itinerary" aria-pressed="false">Itinerary</button></nav>
      <div class="head-actions">
        <span class="sync" id="sync-status" title="Map data source"><span class="status-dot"></span><span id="sync-label">Loading…</span></span>
        <button class="discover-button" id="discover-toggle" type="button" aria-controls="places-panel" aria-expanded="false" aria-label="Open Discover destinations"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.7"/><path d="m16 16 5 5"/></svg><span class="discover-button-label">DISCOVER</span></button>
      </div>
    </header>
    <div class="workspace">
      <main class="map-wrap" aria-label="Interactive trip map">
        <div id="map" aria-label="Map of saved Thailand destinations"></div>
        <div class="map-toolbar">
          <nav class="day-picker" id="trip-day-picker" hidden aria-label="Select itinerary day"></nav>
          <div id="map-area-selector" class="map-area-selector">
            <button id="map-area-indicator" class="map-area-indicator" type="button" aria-haspopup="true" aria-controls="map-area-menu" aria-expanded="false" aria-label="Choose map area: All Thailand">ALL THAILAND <span aria-hidden="true">⌄</span></button>
            <div id="map-area-menu" class="map-area-menu" role="group" aria-label="Choose map area" hidden>
              <button type="button" data-map-city="All" class="active" aria-pressed="true">All Thailand</button>
              <button type="button" data-map-city="Bangkok" aria-pressed="false">Bangkok</button>
              <button type="button" data-map-city="Chiang Mai" aria-pressed="false">Chiang Mai</button>
            </div>
          </div>
          <button id="locate" type="button" class="locate" aria-label="Show my current location" title="Show my current location">⌖</button>
        </div>
        <div id="map-error" class="map-error" hidden>Map tiles unavailable. You can still use the places list and Google Maps links.</div>
      </main>
      <button class="discover-scrim" id="discover-scrim" type="button" hidden aria-label="Close Discover"></button>
      <aside class="places-panel discover-panel" id="places-panel" hidden role="dialog" aria-modal="true" aria-labelledby="discover-title" aria-label="Discover destinations">
        <div class="discover-panel-head">
          <div class="discover-head-copy">
            <h2 id="discover-title">DISCOVER</h2>
            <p id="drawer-summary" class="visually-hidden" aria-live="polite">Places around Thailand</p>
          </div>
          <div class="discover-head-actions">
            <div class="discover-location" id="discover-location">
              <nav class="city-picker city-segments" id="map-cities" aria-label="Show destinations by city">
                <button type="button" class="active" data-city="All" aria-pressed="true">All</button>
                <button type="button" data-city="Bangkok" aria-pressed="false">Bangkok</button>
                <button type="button" data-city="Chiang Mai" aria-pressed="false">Chiang Mai</button>
              </nav>
            </div>
            <button type="button" id="favorites-only" class="favorites-filter" aria-pressed="false" aria-label="Show saved places (0)" title="Show saved places"><svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="m12 2.7 2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg><span id="favorites-count">0</span></button>
            <button class="discover-close" id="discover-close" type="button" aria-label="Close Discover">×</button>
          </div>
        </div>
        <div class="panel-content">
          <section id="trip-controls" class="trip-controls" hidden aria-label="Itinerary options"></section>
          <div class="browse-tools">
            <span id="results" hidden aria-hidden="true" style="display:none"></span>
            <div class="discover-search-row">
              <label class="search-label" for="place-search"><span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m16 16 4 4"/></svg></span><input id="place-search" type="search" placeholder="Find a place…" autocomplete="off"></label>
              <button type="button" id="category-toggle" aria-controls="filter-panel" aria-expanded="false" class="filter-toggle" aria-label="Filter by interest"><span id="filter-value">FILTER</span><span aria-hidden="true">⌄</span></button>
            </div>
            <div id="filter-panel" class="filter-panel" hidden>
              <div class="filter-heading-row"><strong>INTERESTS</strong><button type="button" id="clear-category">Clear</button></div>
              <div id="categories" class="category-chips" aria-label="Filter by category"></div>
            </div>
          </div>

          <div id="places-list" class="places-list" aria-live="polite"><div class="empty">Loading our saved places…</div></div>
        </div>
      </aside>
      <section id="place-detail" class="place-detail" hidden aria-label="Selected destination" role="region"></section>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.1/dist/maplibre-gl.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js" defer></script>
  <script src="./map-basemap.js?v=9" defer></script>
  <script src="./trip-data.js?v=1" defer></script>
  <script src="./place-profiles.js?v=2" defer></script>
  <script src="./venue-research.js?v=2" defer></script>
  <script src="./app.js?v=24" defer></script>
  <script src="./trip-itinerary.js?v=7" defer></script>
  <script src="./place-cards.js?v=6" defer></script>
</body>
</html>
